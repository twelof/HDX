{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Menu</h2>
<div class="card-grid">
  {% for item in items %}
  <div class="card">
    {% if item.image_url %}
      <img src="{{ url_for('static', filename='images/food/' ~ item.image_url) }}" 
           alt="{{ item.name }}" class="food-img">
    {% else %}
      <img src="{{ url_for('static', filename='images/food/placeholder.jpg') }}" 
           alt="No image" class="food-img">
    {% endif %}
    <h3>{{ item.name }}</h3>
    <p>{{ item.description }}</p>
    <span class="price">KES {{ item.price }}</span>
    <p>Section: {{ item.section }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
